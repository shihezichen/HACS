<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队群 · 试用台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#272b35;--fg:#e6e8ee;--dim:#8b93a7;
        --accent:#4c8dff;--ok:#37c07a;--warn:#e8a33d;--err:#e5534b;--me:#1d2430;
        /* 三段式：顶 56 / 中 自适应(唯一滚动) / 底 64 */
        --hx-top-h:56px;--hx-bottom-h:64px;
        /* #418-2/3：左栏宽度（JS 可写 --hx-aside-w，折叠时写 0px）+ 分隔条宽（常量） */
        --hx-aside-w:290px;--hx-split-w:10px;--hx-sb:0px}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg);
       display:flex;flex-direction:column;overflow:hidden}   /* 页面本体永不滚动 */
  header{flex:0 0 auto;height:var(--hx-top-h);min-height:var(--hx-top-h);
         display:flex;align-items:center;gap:12px;padding:0 14px;overflow:hidden;
         border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:5}
  header h1{font-size:15px;margin:0;font-weight:600}
  #who{color:var(--dim);font-size:12px}
  #who b{color:var(--ok)}
  .spacer{flex:1}
  main{flex:1 1 auto;min-height:0;display:grid;
       grid-template-columns:var(--hx-aside-w) var(--hx-split-w) 1fr;
       /* #442：中段拆两行 —— 消息区 1fr（唯一滚动区，不变）+ 底栏 auto；
          左栏与分隔条跨这两行，所以左栏元素本体一直画到窗口可视底，
          底栏左侧那一段不再靠 #composer::before 补色（旧做法依赖画序，会在
          底栏高度/画序变化时重新露出底缝）。 */
       grid-template-rows:1fr auto;overflow:hidden;
       transition:grid-template-columns .18s ease-out}
  aside{grid-column:1;grid-row:1 / span 2;border-right:1px solid var(--line);padding:10px;overflow:hidden;background:#141721;
        /* #432-3：左栏改成 flex 列 —— 两个 TAB 页共用这一栏，只有「任务队列」列表内部滚动，
           页面仍不产生第二个滚动条（#417 的约束不变）。 */
        display:flex;flex-direction:column;min-height:0;
        transition:padding .18s ease-out}
  /* #418-3 折叠态：左栏占 0 宽，聊天区 + 输入区吃满整页 */
  html.aside-collapsed aside{padding:0;border-right:0}
  #asidehead{display:flex;align-items:center;gap:6px;margin:2px 0 8px;flex:0 0 auto}
  #asidehead .ah-t{color:var(--dim);font-size:12px;flex:1 1 auto;min-width:0;
                   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #asidehead button{padding:2px 8px;font-size:11px;white-space:nowrap;flex:0 0 auto}
  html.aside-collapsed #asidehead{display:none}
  /* #418-3 拖拽分隔条：左栏宽度左右可拉（折叠态仍可往右拉回展开） */
  #split{grid-column:2;grid-row:1 / span 2;position:relative;width:var(--hx-split-w);cursor:col-resize;background:#141721;
         border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;
         user-select:none;-webkit-user-select:none}
  #split:hover,#split.drag{background:#232838}
  html.aside-collapsed #split{background:#1a1f2b}
  #splitchev{width:100%;height:52px;padding:0;border:0;border-radius:0;background:transparent;
             color:var(--dim);font-size:9px;line-height:1;cursor:pointer}
  #splitchev:hover{color:var(--fg)}
  section{grid-column:3;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
  .gitem{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;
         cursor:pointer;background:#1a1e28}
  .gitem:hover{border-color:#3a4358}
  .gitem.on{border-color:var(--accent);background:var(--me)}
  .gitem .t{font-weight:600;font-size:13px;word-break:break-all}
  .gitem .m{color:var(--dim);font-size:11px;margin-top:2px;word-break:break-all}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;
       border:1px solid var(--line);color:var(--dim);margin-left:6px}
  /* 群列表不产生第二个滚动条：每行单行省略，行高压到最小 */
  aside .gitem .t, aside .gitem .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag.open{color:var(--ok);border-color:#245a3c}
  .tag.archived{color:var(--warn);border-color:#5a4624}
  #head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;
        align-items:center;flex-wrap:wrap;background:#141721}
  #head .title{font-weight:600}
  /* 中段：唯一滚动容器 */
  #log{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
       -webkit-overflow-scrolling:touch;padding:12px 14px}
  .msg{padding:8px 10px;border-radius:8px;margin-bottom:8px;background:#1a1e28;
       border:1px solid var(--line)}
  .msg.mine{background:var(--me);border-color:#2b3648}
  .msg .h{font-size:11px;color:var(--dim);margin-bottom:3px}
  .msg .h b{color:var(--accent)}
  .msg .h .seq{color:#5d6577}
  .msg .b{white-space:pre-wrap;word-break:break-word}
  .msg.need{border-color:#6b4a12;box-shadow:inset 3px 0 0 var(--warn)}
  .pendo{color:var(--warn);font-size:11px}
  /* 上下文水位（2026-09-24）：服务端按真源渲染，非 Agent 自述 */
  .ctxwm{margin-top:2px;color:#6b7488;font-size:11px;font-variant-numeric:tabular-nums}
  #pending{padding:6px 14px;border-top:1px solid var(--line);color:var(--warn);font-size:12px;
           background:#1b1710;display:none}
  /* 底段：默认 64px（= 下限），内部横向排布，不产生第二个滚动条 */
  /* #347-0②：高度不再钉死 64px —— 跟随被拖高的 textarea 一起长高，下限仍是 64px */
  #composer{grid-column:3;grid-row:2;height:auto;min-height:var(--hx-bottom-h);
            display:flex;align-items:center;gap:8px;
            /* #418-2：左内边距 = 左栏 + 分隔条 + 14px；右内边距 = 14px + 消息区滚动条宽
               —— 输入区左右边界与上方消息区（#log 内容盒）对齐 */
            /* #442：底栏已在左栏右侧那一格，左内边距不再需要「左栏 + 分隔条」补偿，
               直接写 14px —— 与消息区（#log）内容盒左边界严格对齐。
               #452-2：右内边距由「14px + 消息区滚动条宽（--hx-sb）」改成 0 ——
               输入区（textarea）右边界一路顶到窗口右边缘（实测右间隙 93px -> 0px）；
               「发送」按钮不再占位（改成绝对定位塞进输入框内部），右侧不再有留白。
               --hx-sb 仍由 composerSyncSb() 维护，#log 侧不受影响。 */
            padding:8px 0 8px 14px;
            transition:padding-left .18s ease-out;
            border-top:1px solid var(--line);background:var(--panel);position:relative;z-index:6}
  /* #442：原来这里用 #composer::before/::after 给底栏左侧「补」左栏 / 分隔条的底色，
     属于依赖画序的补丁（左栏元素本体只到 y=736，露出 64px 底带时才需要）。
     现在左栏 / 分隔条本身跨到底栏那一行，底色与右边界线由本体绘制，
     伪元素整块删除 —— 底缝在结构上不再可能出现。 */
  /* #452-2：底栏这一行改成「包裹层 + 绝对定位按钮」——
     .row 作为定位上下文（position:relative），textarea 是行内唯一的在流子元素、
     自带 flex:1 所以吃满整个宽度；「发送」按钮脱离文档流，贴 textarea 右下角内 8px。
     #432-1 的用意（按钮不浮在竖直中线、不出现 41px 底边差）仍然成立：
     按钮现在锚在输入框右下角，位置由输入框高度决定，拖高 textarea 时按钮跟着走。
     textarea 加右侧 padding（#452-2c）给按钮让出宽度，文字不会被压住。 */
  #composer .row{flex:1 1 auto;min-width:0;align-items:flex-end;position:relative}
  #composer .row > #send{position:absolute;right:8px;bottom:8px;z-index:2;
                         padding:2px 9px;font-size:12px;line-height:1.35}
  /* #432-1：这一行只有 textarea + 「发送」按钮，原来 align-items:center ——
     输入框被拖高（#347-0② 可拖）后按钮浮在竖直中线，两者底边差 41px；改 flex-end 后
     两个盒子的 margin 盒底边落在同一条像素线上（按钮无 margin，textarea 也没有）。 */
  /* #438-1：「发送」按钮右边那排成员快捷标签（@所有人 / @<human-id> / @hermes / @openclaw-nb）
     整排不再渲染 —— 发送按钮右边不再有 chip 条，底栏只剩 textarea + 「发送」。
     双保险：① JS renderMentions() 不再建 chip（#mentions 恒为空）；② 这里 display:none，
     元素留在 DOM 里但 0×0、无文本、不参与 flex 布局，所以 #432-1 的
     「发送按钮 = textarea 底边同一条像素线（0.00px）」不受影响。
     正文里手打 @xxx 与输入框联想（#ac）照旧可用。 */
  #composer > .mentions{display:none !important}
  #composer > .mentions .chip{flex:0 0 auto}
  /* #434-1：「发送」按钮右边那行说明文字删掉（内容与输入框 placeholder 重复，白占右下角）。
     #hint 元素保留在 DOM（updHint() 仍往里写），但一律不渲染 —— 按钮右边不再有文字。 */
  #composer > #hint{display:none !important}
  /* 输入 @ 时的联想浮层：只列本群能对话的成员 */
  #ac{position:absolute;left:14px;bottom:100%;margin-bottom:-4px;min-width:220px;max-height:230px;overflow:auto;
      background:#1c232f;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 26px rgba(0,0,0,.45);display:none;z-index:40}
  #ac.on{display:block}
  #ac .it{padding:6px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--fg);white-space:nowrap}
  #ac .it .sub{color:var(--muted);font-size:11px;margin-left:6px}
  #ac .it.sel{background:var(--accent);color:#fff}
  #ac .it.sel .sub{color:#e6ecf5}
  .row{display:flex;gap:8px;align-items:flex-start}
  /* #347-0②：输入框高度可拖拽（垂直方向，带上下限）——
     min 38px（= 原默认高，默认外观不变）/ max 60vh；超出时输入框内部滚动，不撑破布局。
     resize:vertical 与 #438-2 的高度内存态（localStorage group.text_h）一律不变。
     #452-2c：右侧内边距 8px -> 76px，给塞在右下角的「发送」按钮让出宽度
     （按钮右侧内缩 8px + 约 44px 宽 + 8px 间隔），输入文字不会跑到按钮底下。 */
  textarea{flex:1;height:38px;min-height:38px;max-height:60vh;resize:vertical;overflow:auto;
           line-height:1.4;background:#0f1218;color:var(--fg);
           border:1px solid var(--line);border-radius:8px;padding:8px 76px 8px 8px;
           font:inherit}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;
         font:inherit;cursor:pointer}
  button.ghost{background:#232838;color:var(--fg)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .mentions{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);
        background:#1a1e28;cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.all{border-color:#4a5a7a}
  /* #438-3：消息区上沿的「只看某发言者」过滤条。
     独立类名 .fchip（不与底栏 .chip 混用），未勾选任何人 = 全显；没人可筛时整条 hidden。 */
  #msgfilter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
             padding:6px 14px;border-bottom:1px solid var(--line);background:#141721}
  #msgfilter[hidden]{display:none}
  #msgfilter .flabel{color:var(--dim);font-size:11px;user-select:none}
  #msgfilter .fchip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);
                    background:#1a1e28;cursor:pointer;user-select:none;color:var(--fg)}
  #msgfilter .fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #msgfilter .fcount{color:var(--dim);font-size:11px;margin-left:auto;user-select:none}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;
         padding:16px;width:min(460px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{margin:0 0 10px;font-size:15px}
  dialog input{width:100%;background:#0f1218;color:var(--fg);border:1px solid var(--line);
               border-radius:8px;padding:8px;font:inherit;margin-bottom:10px}
  .note{color:var(--dim);font-size:12px;margin:6px 0 0}
  pre.banner{white-space:pre-wrap;color:var(--dim);font-size:12px;padding:12px 14px;margin:0}
  .err{color:var(--err)}
  /* 窄屏：三段结构不变，中段仍是唯一滚动区（不塌陷、不叠加） */
  @media (max-width:640px){
    header{gap:6px;padding:0 8px}
    header h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
    #who{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
    header button{padding:6px 9px;font-size:12px;white-space:nowrap;flex:0 0 auto}
    main{grid-template-columns:var(--hx-aside-w) var(--hx-split-w) 1fr}
    :root{--hx-aside-w:118px}   /* 窄屏默认（JS 未加载时的兜底；JS 会在 html 上写内联变量） */
    aside{padding:6px}
    .gitem{padding:6px 7px}
    /* #418-2：窄屏下消息区与输入区同用 10px 内边距，左右边界仍严格对齐 */
    #log{padding:12px 10px}
    /* #452-2：窄屏也把右内边距归零，输入区右边界同样贴到窗口右边缘 */
    #composer{padding:8px 0 8px 10px;gap:6px}
    /* 窄屏放不下 chip 条：隐藏它（正文里手打 @ 仍可用，联想与 hint 照常） */
    #composer > .mentions{display:none}
    /* #438-3：窄屏过滤条内边距与 #log 的 10px 对齐 */
    #msgfilter{padding:6px 10px}
  }

  /* ===== 任务清单面板（task_svc :9981 · 群任务清单 v1）=====
     position:fixed 脱离文档流：不动三段式、不动 #log 唯一滚动容器；
     面板内部自己的列表才滚动（#tp-list）。 */
  #taskbtn{white-space:nowrap}
  #taskpanel{position:fixed;top:var(--hx-top-h);bottom:var(--hx-bottom-h);right:0;
             width:400px;max-width:94vw;background:#141721;border-left:1px solid var(--line);
             display:flex;flex-direction:column;transform:translateX(101%);
             transition:transform .18s ease;z-index:20;box-shadow:-14px 0 30px rgba(0,0,0,.5)}
  #taskpanel.on{transform:translateX(0)}
  #tp-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 10px;
           border-bottom:1px solid var(--line);background:var(--panel)}
  #tp-head b{font-size:13px}
  #tp-head .g{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tp-head button{padding:4px 9px;font-size:12px}
  #tp-err{flex:0 0 auto;display:none;padding:8px 10px;background:#2a1416;border-bottom:1px solid #5a2422;
          color:var(--err);font-size:12px;font-weight:600}
  #tp-list{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 10px}
  .titem{border:1px solid var(--line);border-radius:8px;background:#1a1e28;padding:7px 9px;margin-bottom:7px}
  .titem.sp{border-color:#6b4a12;box-shadow:inset 3px 0 0 var(--warn)}
  .titem.done{opacity:.62}
  .titem .tl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .titem .tid{font-size:11px;color:var(--accent);font-family:ui-monospace,Consolas,monospace}
  .titem .tseq{font-size:11px;color:#5d6577}
  .titem .tpri{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .titem .tpri.special{color:var(--warn);border-color:#5a4624}
  .titem .tt{font-size:13px;font-weight:600;margin:4px 0 3px;word-break:break-word}
  .titem .tm{font-size:11px;color:var(--dim);word-break:break-all}
  .titem .ta{display:flex;align-items:center;gap:8px;margin-top:6px}
  .titem select{background:#0f1218;color:var(--fg);border:1px solid var(--line);border-radius:6px;
                padding:3px 6px;font:inherit;font-size:12px}
  .titem .tmore{font-size:11px;color:var(--accent);cursor:pointer;user-select:none}
  .titem .tc{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);
             font-size:12px;color:var(--dim);white-space:pre-wrap;word-break:break-word}
  .titem .tc.on{display:block}
  #tp-add{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 10px;background:var(--panel)}
  #tp-add input,#tp-add select{width:100%;background:#0f1218;color:var(--fg);border:1px solid var(--line);
        border-radius:7px;padding:6px 8px;font:inherit;font-size:12px;margin-bottom:6px}
  #tp-add .row{margin-bottom:0}
  #tp-add .row input,#tp-add .row select{margin-bottom:0}
  #tp-add .row select{flex:0 0 92px;width:auto}
  #tp-add .row input{flex:1 1 auto;min-width:0}
  #tp-add button{padding:6px 11px;font-size:12px;white-space:nowrap}
  @media (max-width:640px){#taskpanel{width:94vw}header button{padding:6px 9px}}

  /* ===== #432-3：左栏两个 TAB（「我的群」/「任务队列」）=====
     数据源与右侧抽屉同一套：task_svc :9981 的 GET /tasks?group=<本群 session_id>（CORS *）。
     两个 TAB 页共用左栏宽；只有「任务队列」自己的列表滚动（#tqueue），页面本体仍不滚。 */
  #asidehead .atab{flex:1 1 auto;min-width:0;background:#1a1e28;color:var(--dim);
                   border:1px solid var(--line);border-radius:7px;padding:4px 6px;
                   font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;
                   overflow:hidden;text-overflow:ellipsis}
  #asidehead .atab:hover{border-color:#3a4358}
  #asidehead .atab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #asidehead .atab .atn{font-size:10px;opacity:.9;margin-left:4px}
  /* #448-3：队列清空按钮（只在「任务队列」TAB 显示） */
  #asidehead .atclear{flex:0 0 auto;padding:4px 7px;font-size:12px;white-space:nowrap}
  #groups{flex:0 0 auto;min-width:0}
  #groups[hidden],#tqueue[hidden]{display:none !important}
  #tqueue{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px}
  .tqitem{border:1px solid var(--line);border-radius:8px;background:#1a1e28;
          padding:6px 8px;margin-bottom:6px}
  .tqitem.special{border-color:#6b4a12;box-shadow:inset 3px 0 0 var(--warn)}
  .tqitem.done{opacity:.62}
  .tqitem .tqh{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .tqitem .tqs{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .tqitem .tqs.pending{color:var(--warn);border-color:#5a4624}
  .tqitem .tqs.running{color:var(--accent);border-color:#2b4166}
  .tqitem .tqs.done{color:var(--ok);border-color:#245a3c}
  .tqitem .tqs.failed{color:var(--err);border-color:#5a2422}
  /* #534：条目正文 = 抽象后的任务名（一行短名），悬停出详情 */
  /* #541：短名与详情都来自**模型**（异步富化），未回来时先显示规则兜底名 + 「富化中…」 */
  .tqitem .tqd{font-size:12px;font-weight:600;margin:3px 0 2px;word-break:break-word;
               cursor:help}
  .tqitem .tqd:hover{color:#fff;text-decoration:underline dotted}
  .tqitem .tqe{font-size:10px;color:var(--warn);border:1px dashed #5a4624;
               border-radius:99px;padding:0 5px;margin-left:4px;font-weight:400;cursor:help}
  .tqitem .tqm{font-size:10px;color:var(--dim);word-break:break-all}
/* ================= #476：#编号 引用标签 + 展开浮窗 ================= */
/* 聊天记录里 #NNN（正文内 + 每条消息头部的 seq）都是可点的引用标签：
   点一次展开那条消息的浮窗，再点一次收起。浮窗可拖动、可固定（固定后刷新仍在原位），
   多个标签可同时展开、多个浮窗并存。浮层挂在 body 下（#refpop），
   所以 #log 每次轮询重渲染都不会碰它。 */
.mref{color:#7fb2ff;cursor:pointer;border-bottom:1px dotted #7fb2ff;border-radius:3px;
      padding:0 1px;transition:background .12s}
.mref:hover{background:#22304a}
.mref.on{background:#2c4670;color:#dce9ff}
.msg .h .seq.mref{color:#8fb7ee}
#refpop{position:fixed;left:0;top:0;width:0;height:0;z-index:70}
.pop{position:fixed;width:360px;min-width:240px;max-width:min(560px,92vw);
     background:#161b26;border:1px solid #3a4658;border-radius:10px;
     box-shadow:0 14px 34px rgba(0,0,0,.6);display:flex;flex-direction:column;
     overflow:hidden}
.pop.dragging{opacity:.92}
.pop.pinned{border-color:#3f7a4f;box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 0 1px #2c5a38 inset}
.pop .ph{display:flex;gap:6px;align-items:center;padding:5px 6px 5px 9px;
         border-bottom:1px solid var(--line);font-size:11px;color:var(--dim);
         background:#1b2130;cursor:move;user-select:none}
.pop .ph .refseq{color:#8fb7ee;font-weight:600}
.pop .ph .refmeta{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pop .ph .spacer{flex:1 1 auto}
.pop .ph button{padding:1px 7px;font-size:11px;line-height:1.5;cursor:pointer}
.pop .ph .refpin.on{color:var(--ok);border-color:#2c5a38}
.pop .pb{padding:8px 10px;overflow:auto;max-height:44vh;font-size:13px;line-height:1.5;
         white-space:pre-wrap;word-break:break-word}
.pop .pb.err{color:var(--warn)}
</style>
</head>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const API = "";              // 同源托管：直接打本站 /api
let WHO = null, MYID = "", AGENTS = [], GROUPS = [], CUR = null, CURSOR = 0, TIMER = null;
const SEEN = new Set();   // 已渲染过的 message_id：轮询只追加新的，防重复
const LS_LAST = "group.last_sid";   // 记住上次看的群，刷新后回到原处

async function api(method, path, body) {
  const opt = { method, credentials: "include", headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(API + path, opt);
  const txt = await r.text();
  let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
  if (r.status === 401) {
    // 未登录：本服务不自己发登录页 —— 转交门户登录页，并把「回本页」带上
    const back = encodeURIComponent(location.pathname + location.search);
    location.href = "/login?next=" + back;
    throw new Error("需要登录，正在跳转登录页…");
  }
  if (!r.ok) {
    const code = (data && data.error && (data.error.code || data.error)) || ("HTTP " + r.status);
    const hint = {
      mention_required: "Agent 发言必须 @（人不需要）",
      unknown_mention: "提到了不在群里的人",
      unknown_member: "有成员不存在（看名册）",
      only_owner_can_close: "只有发起人能宣布散会",
      session_archived: "这个群已经散会（归档）了",
      creator_required: "建群必须由人发起",
      bad_json: "请求体不是合法 JSON"
    }[code] || "";
    throw new Error(code + (hint ? " — " + hint : ""));
  }
  return data;
}

const esc = (s) => String(s == null ? "" : s)
  .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mid = (a) => (a && typeof a === "object") ? (a.id || "") : (a || "");
const mname = (a) => (a && typeof a === "object") ? (a.display || a.id || "") : (a || "");

// ================= #418-3 左栏「我的群」：向左折叠 + 分隔条左右拖拽调宽 =================
// 折叠：左栏占 0 宽，聊天区 + 输入区吃满整页；拖拽：拉分隔条调宽；两者都记 localStorage。
// 另：#418-2 输入区右边界跟随消息区滚动条宽度（--hx-sb），左右都与 #log 内容盒对齐。
const LS_AW = "group.aside_w", LS_AC = "group.aside_collapsed";
const ASIDE_MIN = 110, ASIDE_MAX = 560;

function asideDefaultW() { return (window.innerWidth <= 640) ? 118 : 290; }

function asideReadW() {
  let v = NaN;
  try { v = parseInt(localStorage.getItem(LS_AW) || "", 10); } catch (e) { v = NaN; }
  if (!v || isNaN(v)) v = asideDefaultW();
  return Math.min(ASIDE_MAX, Math.max(ASIDE_MIN, v));
}

function asideReadCollapsed() {
  try { return localStorage.getItem(LS_AC) === "1"; } catch (e) { return false; }
}

let ASIDE_W = asideReadW(), ASIDE_C = asideReadCollapsed();

// 输入区右内边距 = 14px + 消息区滚动条宽（滚动条出现/消失都跟着走）
function composerSyncSb() {
  const lg = $("log"); if (!lg) return;
  const sb = Math.max(0, lg.offsetWidth - lg.clientWidth);
  document.documentElement.style.setProperty("--hx-sb", sb + "px");
}

function asideApply() {
  const root = document.documentElement;
  root.style.setProperty("--hx-aside-w", (ASIDE_C ? 0 : ASIDE_W) + "px");
  root.classList.toggle("aside-collapsed", !!ASIDE_C);
  const chev = $("splitchev");
  if (chev) { chev.textContent = ASIDE_C ? "▶" : "◀"; chev.title = ASIDE_C ? "展开「我的群」面板" : "折叠「我的群」面板"; }
  composerSyncSb();
}

function asideSave() {
  try {
    localStorage.setItem(LS_AW, String(ASIDE_W));
    localStorage.setItem(LS_AC, ASIDE_C ? "1" : "0");
  } catch (e) { /* 无痕模式就算了 */ }
}

function asideToggle() { ASIDE_C = !ASIDE_C; asideApply(); asideSave(); }
function asideReset() { ASIDE_W = asideDefaultW(); asideApply(); asideSave(); }

asideApply();

(function asideDrag() {
  const sp = $("split");
  if (!sp) return;
  let dragging = false;
  sp.addEventListener("mousedown", (e) => {
    if (e.target && e.target.id === "splitchev") return;    // 点箭头 = 切换折叠，不算拖拽
    dragging = true; sp.classList.add("drag");
    document.body.style.userSelect = "none";
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const main = document.querySelector("main");
    const left = main ? main.getBoundingClientRect().left : 0;
    const w = e.clientX - left;
    if (ASIDE_C && w > 60) ASIDE_C = false;                 // 从折叠态往右拉 = 重新展开
    ASIDE_W = Math.min(ASIDE_MAX, Math.max(ASIDE_MIN, Math.round(w)));
    asideApply();
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false; sp.classList.remove("drag");
    document.body.style.userSelect = "";
    asideSave();
  });
  sp.addEventListener("dblclick", asideReset);
})();

window.addEventListener("resize", composerSyncSb);

// ================= #438-2：输入框高度记忆（刷新后仍是上次拖拽的高度）=================
// #347-0② 让 textarea 可垂直拖拽（resize:vertical），但高度只活在内存里，刷新就回 38px。
// 这里把「拖完的高度」写进 localStorage，加载时再写回 inline style.height ——
//   ① 与原生 resize 手柄写的是同一个属性（都改 textarea.style.height / 盒高），所以同一条路；
//   ② 上下限跟 CSS 对齐：min 38px（=min-height）/ max 60vh（=max-height），恢复时同样夹紧。
const LS_TH = "group.text_h";
const TEXT_MIN_H = 38;
let TEXT_H_APPLY = false;          // 正在「恢复」而不是「用户在拖」：跳过采集，免得自己写自己

function textMaxH() {
  return Math.max(TEXT_MIN_H, Math.round((window.innerHeight || 800) * 0.6));   // = CSS max-height:60vh
}
function textReadH() {
  let v = NaN;
  try { v = parseInt(localStorage.getItem(LS_TH) || "", 10); } catch (e) { v = NaN; }
  if (!v || isNaN(v)) return null;                                              // 没存过 → 不动，保持默认 38px
  return Math.min(textMaxH(), Math.max(TEXT_MIN_H, v));
}
function textApplyH() {
  const t = $("text"); if (!t) return null;
  const h = textReadH(); if (h == null) return null;
  TEXT_H_APPLY = true;
  t.style.height = h + "px";
  TEXT_H_APPLY = false;
  return h;
}
function textSaveH() {
  const t = $("text"); if (!t) return null;
  const h = Math.round(t.getBoundingClientRect().height);
  if (!h || h < TEXT_MIN_H) return null;
  try { localStorage.setItem(LS_TH, String(h)); } catch (e) { /* 无痕模式就算了 */ }
  return h;
}
textApplyH();                      // 页面加载（脚本在 body 末尾，DOM 已就绪）就恢复
if (window.ResizeObserver) {       // 拖拽 / 字体加载 / 窗口缩放等任何盒高变化都能被看见
  try { new ResizeObserver(() => { if (!TEXT_H_APPLY) textSaveH(); }).observe($("text")); } catch (e) {}
}
window.addEventListener("mouseup", () => { if (!TEXT_H_APPLY) textSaveH(); });   // 拖完补一刀

// ================= #438-3：消息区按发言者过滤 =================
// 规则：勾中谁就只看谁的发言（可多选）；一个都不勾 = 全显（后端返回多少就显示多少）。
// 实现：消息照常全量渲染 / 轮询追加，只切 .msg 的 display —— 不动 #log 的滚动容器角色，
//       也不改 pull() 的「贴底跟随」逻辑（#347-0①）。
const FILTER = new Set();          // 勾中的发言者 id；空集 = 全显
let FILTER_SIG = null;             // 已渲染 chip 的签名（发言者集合 + 勾选态），没变就不重建 DOM

function applyMsgFilter() {
  const log = $("log"); if (!log) return { shown: 0, total: 0 };
  let shown = 0, total = 0;
  log.querySelectorAll(".msg").forEach(el => {
    const a = el.dataset.author || "";
    const vis = (!FILTER.size || FILTER.has(a));
    el.style.display = vis ? "" : "none";
    total++; if (vis) shown++;
  });
  const c = document.querySelector("#msgfilter .fcount");
  if (c) c.textContent = FILTER.size ? ("显示 " + shown + "/" + total + " 条") : "";
  return { shown: shown, total: total };
}

function renderMsgFilter(force) {
  const box = $("msgfilter"), log = $("log");
  if (!box || !log) return;
  const seen = new Map();                                  // 按「首次出现顺序」记发言者
  log.querySelectorAll(".msg").forEach(el => {
    const a = el.dataset.author || ""; if (!a || seen.has(a)) return;
    seen.set(a, el.dataset.authorname || a);
  });
  const sig = Array.from(seen.keys()).join("|") + "#" + Array.from(FILTER).sort().join(",");
  if (!force && sig === FILTER_SIG) return;                 // 发言者没新增 → 不重建（免得 3 秒一刷）
  FILTER_SIG = sig;
  if (!seen.size) { box.hidden = true; box.innerHTML = ""; return; }   // 没人可筛 → 整条不渲染
  box.hidden = false;
  box.innerHTML = "";
  const lab = document.createElement("span");
  lab.className = "flabel"; lab.textContent = "只看：";
  box.appendChild(lab);
  seen.forEach((name, id) => {
    const c = document.createElement("span");
    c.className = "fchip" + (FILTER.has(id) ? " on" : "");  // 独立类名：与底栏 .chip 不混用
    c.dataset.m = id; c.textContent = name;
    c.title = "只看 " + name + " 的发言（可多选）；一个都不勾 = 全显";
    c.onclick = () => {
      if (FILTER.has(id)) FILTER.delete(id); else FILTER.add(id);
      renderMsgFilter(true); applyMsgFilter();
    };
    box.appendChild(c);
  });
  const clr = document.createElement("span");
  clr.className = "fchip" + (FILTER.size ? "" : " on");
  clr.dataset.clear = "1"; clr.textContent = "全显";
  clr.title = "取消全部勾选，恢复显示所有发言";
  clr.onclick = () => { FILTER.clear(); renderMsgFilter(true); applyMsgFilter(); };
  box.appendChild(clr);
  const cnt = document.createElement("span");
  cnt.className = "fcount";
  box.appendChild(cnt);
}

function filterReset() { FILTER.clear(); FILTER_SIG = null; renderMsgFilter(true); applyMsgFilter(); }

// 调试/自测句柄（headless 断言用；不影响页面行为）
window.__h438 = { FILTER, applyMsgFilter, renderMsgFilter, textSaveH, textApplyH, textMaxH, TEXT_MIN_H };

async function boot() {
  try {
    WHO = await api("GET", "/api/whoami");
    const u = (WHO && WHO.user) || {};
    $("who").innerHTML = u.role === "owner"
      ? '身份：<b>' + esc(u.role_cn || u.role) + '</b>（' + esc(u.source || "") + ' 免登录）'
      : '身份：<b>' + esc(u.display || u.name || "?") + '</b>';
  } catch (e) { $("who").textContent = "身份读取失败：" + e.message; }
  try { AGENTS = (await api("GET", "/api/agents")).agents || []; } catch (e) { AGENTS = []; }
  await loadGroups();
  // 刷新后回到上次看的那个群（否则刷完一片空白，看着像"聊天记录丢了"）
  let last = null;
  try { last = localStorage.getItem(LS_LAST); } catch (e) { last = null; }
  const pick = GROUPS.find(s => s.session_id === last) ||
               GROUPS.find(s => s.state === "open") || GROUPS[0];
  if (pick) await openGroup(pick);
}

async function loadGroups() {
  const d = await api("GET", "/api/sessions");
  GROUPS = ((d && d.sessions) || []).filter(s => (s.kind || "") === "meet");
  const box = $("groups"); box.innerHTML = "";
  if (!GROUPS.length) { box.innerHTML = '<div class="note">还没有群。点右上「＋ 建群」开一个。</div>'; return; }
  GROUPS.forEach(s => {
    const ids = (s.members || []).map(mid);
    const el = document.createElement("div");
    el.className = "gitem" + (CUR && CUR.session_id === s.session_id ? " on" : "");
    el.innerHTML = '<div class="t">' + esc(s.title || s.session_id) +
      '<span class="tag ' + esc(s.state) + '">' + esc(s.state === "open" ? "进行中" : "已散会") + '</span></div>' +
      '<div class="m">' + esc(s.session_id) + (ids.length ? " · " + esc(ids.join(",")) : "") + '</div>';
    el.onclick = () => openGroup(s);
    box.appendChild(el);
  });
}

async function openGroup(s) {
  CUR = s; CURSOR = 0; SEEN.clear();
  try { localStorage.setItem(LS_LAST, s.session_id); } catch (e) { /* 无痕模式就算了 */ }
  $("gtitle").textContent = s.title || s.session_id;
  const ids = (s.members || []).map(mid);
  $("gmeta").textContent = s.session_id + (ids.length ? " · " + ids.join(", ") : "");
  const open = s.state === "open";
  $("send").disabled = !open;
  $("closebtn").disabled = !(open && (!MYID || mid(MYID) === "" || s.created_by === MYID));
  $("log").innerHTML = "";
  acClose();
  renderMentions(ids);
  filterReset();           // #438-3：切群 = 发言者全换了，过滤勾选清空（回到「全显」）
  refPopsReset(true);      // #476：换群 —— 旧群的引用浮窗全部收起（固定记录也复位，见下）
  await loadGroups();
  await pull();
  refPopsRestore(s.session_id);   // #476：本群「固定过」的引用浮窗回到原位（刷新/切群都还原）
  if (TIMER) clearInterval(TIMER);
  TIMER = setInterval(() => {
    pull(true).catch(() => {});
    // #448：队列 TAB 开着时跟着轮询，状态（待办/进行中/已完成）自己在页面上刷新
    if (ATAB === "queue") tqLoad();
  }, 3000);
  if (ATAB === "queue") tqLoad();     // #432-3：切群时「任务队列」TAB 跟着换成新群的任务
}

function renderMentions(ids) {
  // #438-1：底栏「发送」按钮右边那排成员快捷标签（@所有人 / @<human-id> / @hermes / @openclaw-nb）
  //   已整排下线：这里不再建任何 chip，#mentions 恒为空盒子（CSS 里再 display:none 兜一层，
  //   所以它 0×0、无文本、不占 flex 位置 —— 发送按钮与输入框的底边对齐不受影响）。
  //   选人方式不变：在正文里手打 @xxx（配输入框联想 #ac），sel() 的 textMentions() 照常解析；
  //   不写 @ 就是默认 @所有人（见 updHint()）。
  const box = $("mentions");
  if (box) { box.innerHTML = ""; box.hidden = true; }
  void ids;
}

// 点完 @ 把光标还给输入框（并落在末尾），手不用来回挪
function focusText() {
  const t = $("text");
  if (!t) return;
  try { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } catch (e) { t.focus(); }
}

// #432-2：点右侧的 agent chip（如 @hermes）= 在【当前光标处】插入 "@hermes "。
//   用 textarea 的 selectionStart/selectionEnd 切原串（有选区就替换选区），
//   不追加到末尾、不把光标挤回队尾；插完光标落在 @xxx 之后并 focus 回输入框。
//   insertAtCursor 是纯函数式的取值-改值-设光标，不触发 input 事件（免得联想浮层乱弹）。
function insertAtCursor(ins) {
  const t = $("text"); if (!t) return null;
  const v = String(t.value == null ? "" : t.value);
  let s = (t.selectionStart == null) ? v.length : t.selectionStart;
  let e = (t.selectionEnd == null) ? s : t.selectionEnd;
  s = Math.max(0, Math.min(s, v.length));
  e = Math.max(s, Math.min(e, v.length));
  // 后面紧跟的字符已经是空白就不再补空格，避免插出两个空格
  const tail = /^\s/.test(v.slice(e)) ? "" : " ";
  const piece = ins + tail;
  t.value = v.slice(0, s) + piece + v.slice(e);
  const np = s + piece.length;                 // 光标落在 @xxx + 尾空格之后
  try { t.setSelectionRange(np, np); } catch (err) {}
  try { t.focus(); } catch (err) {}
  updHint();
  return { before: v, at: s, inserted: piece, after: t.value, caret: np };
}

// 同一个 @ 词已经在正文里就不再插（连点 chip 不会插出两个 @hermes）
function insertMention(id) {
  const t = $("text"); if (!t) return null;
  const tok = "@" + id;
  const re = new RegExp(tok.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![\\w\\u4e00-\\u9fa5-])");
  if (re.test(String(t.value || ""))) { updHint(); try { t.focus(); } catch (e) {} return null; }
  return insertAtCursor(tok);
}

// 输入框里手打 @openclaw-nb / @所有人 —— 等同于点下面的 @ 栏
function textMentions() {
  const t = $("text").value || "";
  const out = [];
  const re = /@([A-Za-z0-9_\u4e00-\u9fa5\-]+)/g;
  let m; while ((m = re.exec(t)) !== null) {
    const n = m[1];
    if (n === "所有人" || n === "all" || n === "全员") out.push("@all");
    else out.push(n);
  }
  return out;
}

function groupMemberIds() { return ((CUR && CUR.members) || []).map(mid).filter(Boolean); }

// ---------- 输入 @ 时的联想（只列本群能对话的成员） ----------
const AC = { open: false, items: [], idx: 0, start: -1 };

function acCandidates(prefix) {
  const ids = groupMemberIds().filter(id => id !== MYID);
  let list = [{ id: "@all", label: "@所有人", sub: "全群" }].concat(
    ids.map(id => {
      const a = AGENTS.find(x => mid(x) === id) || {};
      return { id, label: "@" + id, sub: mname(a) === id ? "" : mname(a) };
    }));
  const p = String(prefix || "").toLowerCase();
  if (!p) return list;
  return list.filter(x => x.label.toLowerCase().indexOf(p) >= 0 || String(x.sub).toLowerCase().indexOf(p) >= 0);
}

function acClose() {
  AC.open = false; AC.items = []; AC.start = -1;
  const b = $("ac"); if (b) { b.innerHTML = ""; b.classList.remove("on"); }
}

function acRender() {
  const box = $("ac"); if (!box) return;
  box.innerHTML = "";
  if (!AC.items.length) { acClose(); return; }
  AC.items.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "it" + (i === AC.idx ? " sel" : "");
    d.innerHTML = esc(it.label) + (it.sub ? '<span class="sub">' + esc(it.sub) + '</span>' : "");
    d.onmousedown = (e) => { e.preventDefault(); acPick(i); };   // preventDefault：别让输入框失焦
    box.appendChild(d);
  });
  box.classList.add("on");
  AC.open = true;
  box.scrollTop = Math.max(0, AC.idx * 30 - 60);
}

// 看光标前是不是正在打 @xxx
function acCheck() {
  const t = $("text"); if (!t) return;
  const pos = (t.selectionStart == null) ? t.value.length : t.selectionStart;
  const m = /@([A-Za-z0-9_\u4e00-\u9fa5\-]*)$/.exec(t.value.slice(0, pos));
  if (!m) { acClose(); return; }
  AC.start = pos - m[1].length - 1;            // '@' 所在下标
  AC.items = acCandidates(m[1]); AC.idx = 0;
  if (AC.items.length) acRender(); else acClose();
}

function acPick(i) {
  const it = AC.items[i]; if (!it || AC.start < 0) return;
  const t = $("text");
  const cur = (t.selectionStart == null) ? t.value.length : t.selectionStart;
  const ins = "@" + (it.id === "@all" ? "所有人" : it.id) + " ";
  t.value = t.value.slice(0, AC.start) + ins + t.value.slice(cur);
  const np = AC.start + ins.length;
  try { t.setSelectionRange(np, np); } catch (e) {}
  acClose(); updHint(); t.focus();
}

function sel() {
  const out = [];
  document.querySelectorAll("#mentions .chip.on").forEach(c => {
    out.push(c.dataset.all ? "@all" : c.dataset.m);
  });
  const ids = groupMemberIds();
  // #539：正文手打的 @名字 按**大小写不敏感**回落到成员表原文再发。
  // 群里显示的就是 "Hermes" 这种写法，人照显示名打 @Hermes 是本能的；
  // 以前只做严格相等匹配 → "Hermes" 被丢掉 → mentions 空成 [] →
  // 后端只认正文解析，点名解析不出就整条钩子不触发（派活不入队）。
  // 多个成员仅大小写不同（有歧义）时不回落，保持原来的严格匹配。
  const canon = (n) => {
    const low = String(n).toLowerCase();
    const hit = ids.filter(i => String(i).toLowerCase() === low);
    return hit.length === 1 ? hit[0] : null;
  };
  textMentions().forEach(x => {
    if (x === "@all") out.push("@all");
    else if (ids.indexOf(x) >= 0) out.push(x);   // 只认群内成员，避免后端 422 unknown_mention
    else {
      const c = canon(x);
      if (c) out.push(c);
    }
  });
  return Array.from(new Set(out));
}
function updHint() {
  const s = sel();
  $("hint").textContent = s.length
    ? "将发给：" + s.map(x => x === "@all" ? "@所有人" : "@" + x).join("、")
    : "没选人 = @所有人（全群都要处理并回应）。";
}

// #347-0①：是否已贴底（24px 容差）。每次实时算，不缓存标志位。
function atBottom(el) {
  if (!el) return true;
  return (el.scrollHeight - el.scrollTop - el.clientHeight) <= 24;
}

async function pull(inc) {
  if (!CUR) return;
  const q = "?limit=200" + (inc && CURSOR ? "&after_seq=" + CURSOR : "");
  const d = await api("GET", "/api/sessions/" + encodeURIComponent(CUR.session_id) + "/messages" + q);
  if (d && d.me) MYID = d.me;
  const msgs = (d && d.messages) || [];
  const log = $("log");
  // #347-0①：先判贴底、再追加。首次/切群(!inc)视为贴底；其余按当前滚动位置实时算。
  const stick = !inc || atBottom(log);
  if (!inc) { log.innerHTML = ""; SEEN.clear(); }
  msgs.forEach(m => {
    const seq = m.seq || 0;
    const key = m.message_id || ("seq:" + seq);
    if (SEEN.has(key)) return;          // 同一条只渲染一次（后端重放/参数兜底都不怕）
    SEEN.add(key);
    if (seq) CURSOR = Math.max(CURSOR, seq);
    if (seq) MSGCACHE.set(msgKey(CUR && CUR.session_id, seq), m);   // #476：本地缓存，**按群 + seq** 存
    const meta = m.meta || {};
    const need = meta.needs_response || [];
    const aud = (meta.audience || []).map(x => x === "<human-id>" ? "刚哥(" + x + ")" : x).join("、");
    const mine = mid(m.author) === MYID;
    const el = document.createElement("div");
    el.className = "msg" + (mine ? " mine" : "") + (need.includes(MYID) ? " need" : "");
    // #438-3：发言者落到 data-* 上 —— 过滤条按它归组，勾选后切 display（不动渲染内容本身）
    el.dataset.author = mid(m.author) || "";
    el.dataset.authorname = mname(m.author) || "";
    el.dataset.seq = String(seq);           // #476：这条消息自己的编号
    // 上下文水位（2026-09-24）：服务端按真源（OpenClaw sessions.json）渲染好挂在
    // meta.context，前端只负责显示 —— Agent 不再手打那行，避免分母写错与污染 prompt cache。
    const cx = (meta.context && meta.context.text) ? meta.context : null;
    el.innerHTML =
      '<div class="h"><span class="seq mref" data-seq="' + esc(seq) +
        '" title="点击展开 / 收起 #' + esc(seq) + ' 这条消息">#' + esc(seq) + '</span> <b>' + esc(mname(m.author)) +
      '</b>' + (m.author && m.author.type === "agent" ? '（Agent）' : '（人）') + ' → ' + esc(aud || "-") +
      ' · ' + esc(m.created_at || "") +
      (need.length ? ' <span class="pendo">待回应：' + esc(need.join("、")) + '</span>' : '') +
      '</div><div class="b">' + linkRefs(esc(m.text)) + '</div>' +
      (cx ? '<div class="ctxwm" title="当前上下文占用 / 模型窗口（服务端按真源渲染，非 Agent 自述）">📚 ' +
        esc(cx.text) + '</div>' : '');   // #476：正文里的 #NNN 变可点标签
    log.appendChild(el);
  });
  if (stick) log.scrollTop = log.scrollHeight;   // #347-0①：只有贴底才跟随，非贴底一动不动

  const my = (d && d.my_pending) || [];
  const p = $("pending");
  if (my.length) {
    p.style.display = "block";
    p.textContent = "★ 我还欠 " + my.length + " 条回应：" +
      my.map(x => "#" + x.seq + "（来自 " + x.from + "）").join("　");
  } else { p.style.display = "none"; }
  composerSyncSb();        // #418-2：消息区滚动条出现/消失 → 输入区右边界跟着对齐
  // #438-3：本轮可能带进新发言者 → 补过滤 chip（集合没变则不重建），再按当前勾选切显示
  renderMsgFilter(false); applyMsgFilter();
}

async function send() {
  if (!CUR) return;
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true;
  try {
    await api("POST", "/api/sessions/" + encodeURIComponent(CUR.session_id) + "/messages",
              { text, mentions: sel() });
    $("text").value = "";
    acClose();
    document.querySelectorAll("#mentions .chip.on").forEach(c => c.classList.remove("on"));
    updHint();
    await pull(true);
    // #347-0① 例外：自己刚发的那条永远跟到底（本地动作，不算「新消息到达」）
    const lg = $("log"); if (lg) { lg.scrollTop = lg.scrollHeight; }
    focusText();                       // 发完手还在输入框，接着说话
  } catch (e) { alert("发送失败：" + e.message); }
  finally { $("send").disabled = CUR.state !== "open"; }
}

async function closeGroup() {
  if (!CUR) return;
  if (!confirm("确定宣布散会？群会变成归档状态，之后不能再发言。")) return;
  try {
    await api("PATCH", "/api/sessions/" + encodeURIComponent(CUR.session_id), { state: "archived" });
    CUR.state = "archived";
    $("closebtn").disabled = true; $("send").disabled = true;
    await pull(true); await loadGroups();
  } catch (e) { alert("关群失败：" + e.message); }
}

function openDialog() {

async function createGroup() {

$("newbtn").onclick = openDialog;
$("collapsebtn").onclick = asideToggle;      // #418-3 折叠左栏
$("splitchev").onclick = asideToggle;        // #418-3 分隔条上的箭头：展开 / 折叠

$("send").onclick = send;

$("text").addEventListener("input", () => { updHint(); acCheck(); });   // 手打 @ 出联想
$("text").addEventListener("click", acCheck);
$("text").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); return; }  // 任何时候都能发
  if (AC.open) {
    if (e.key === "ArrowDown") { e.preventDefault(); AC.idx = (AC.idx + 1) % AC.items.length; acRender(); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); AC.idx = (AC.idx - 1 + AC.items.length) % AC.items.length; acRender(); return; }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acPick(AC.idx); return; }
    if (e.key === "Escape")    { e.preventDefault(); acClose(); return; }
  }
});
focusText();
boot().catch(e => { $("who").textContent = "启动失败：" + e.message; });

// ================= 任务清单面板（task_svc :9981 · 群任务清单 v1） =================
// 数据源：程序维护的任务清单（SQLite），不依赖任何 Agent/LLM 记忆。
const TSVC = "http://<tailnet-host>:9981";
const TGROUP_DEFAULT = "meet_20260921_demo01";
const TSTATUS = { pending: "待开始", running: "进行中", done: "已完成", failed: "失败" };
let TPOLL = null;
// #432-3：任务查询分组 = 当前打开的群（原来写死 demo01，切群后清单不跟着走）
function tgid() { return (CUR && CUR.session_id) || TGROUP_DEFAULT; }

async function tApi(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(TSVC + path, opt);
  const txt = await r.text();
  let d = null; try { d = txt ? JSON.parse(txt) : null; } catch (e) { d = txt; }
  if (!r.ok) {
    const code = (d && d.error && (d.error.code || d.error)) || ("HTTP " + r.status);
    throw new Error(code);
  }
  return d;
}

function tErrShow(msg) {
  const e = $("tp-err");
  e.style.display = "block";
  e.textContent = "⚠ 任务服务不可达（" + msg + "）——下面是空的，不是没有任务，是清单服务连不上。";
  $("tp-count").textContent = "";
  $("tp-list").innerHTML = '<div class="note">任务清单暂时没拉到——不是空的，是服务连不上。</div>';
}

function tErrHide() { const e = $("tp-err"); e.style.display = "none"; e.textContent = ""; }

async function tLoad() {
  if (!$("taskpanel")) return;
  const g = tgid();
  const gl = $("tp-group"); if (gl) gl.textContent = g;
  try {
    const d = await tApi("GET", "/tasks?group=" + encodeURIComponent(g));
    tErrHide();
    tRender(d);
  } catch (e) { tErrShow(e.message); }
}

function tRow(t) {
  const el = document.createElement("div");
  el.className = "titem" + (t.status === "done" ? " done" : "") + (t.priority === "special" ? " sp" : "");
  el.dataset.id = t.id;
  const opts = ["pending", "running", "done", "failed"].map(s =>
    '<option value="' + s + '"' + (t.status === s ? " selected" : "") + '>' + TSTATUS[s] + "</option>").join("");
  el.innerHTML =
    '<div class="tl"><span class="tid">' + esc(t.id) + "</span>" +
      (t.msg_seq ? '<span class="tseq">来源 ' + esc(t.msg_seq) + "</span>" : "") +
      '<span class="tpri ' + esc(t.priority) + '">' + (t.priority === "special" ? "特殊" : "普通") + "</span></div>" +
    '<div class="tt">' + esc(t.title) + "</div>" +
    '<div class="tm">责任人 ' + esc(t.owner || "待认领") + " · 提出者 " + esc(t.proposer || "-") +
      " · 已派发 " + (t.dispatch_count || 0) + " 次 · " + esc(t.created_at || "") + "</div>" +
    '<div class="ta"><select class="tst" data-id="' + esc(t.id) + '">' + opts + "</select>" +
      (t.content ? '<span class="tmore">详情</span>' : "") + "</div>" +
    (t.content ? '<div class="tc">' + esc(t.content) + "</div>" : "");
  const sel = el.querySelector(".tst");
  sel.onchange = async (ev) => {
    const nv = ev.target.value;
    sel.disabled = true;
    try { await tApi("PATCH", "/tasks/" + encodeURIComponent(t.id), { status: nv }); await tLoad(); }
    catch (e) { tErrShow(e.message); }
    finally { sel.disabled = false; }
  };
  const more = el.querySelector(".tmore");
  if (more) more.onclick = () => { el.querySelector(".tc").classList.toggle("on"); };
  return el;
}

function tRender(d) {
  const list = $("tp-list");
  const ts = (d && d.tasks) || [];
  $("tp-count").textContent = "共 " + ts.length + " 条";
  list.innerHTML = "";
  if (!ts.length) {
    list.innerHTML = '<div class="note">这个群还没有任务。下面可以直接加一条。</div>';
    return;
  }
  ts.forEach(t => list.appendChild(tRow(t)));
}

async function tAdd() {
  const title = ($("tp-title").value || "").trim();
  if (!title) { $("tp-title").focus(); return; }
  $("tp-addbtn").disabled = true;
  try {
    await tApi("POST", "/tasks", { group_id: tgid(), title: title,
      owner: ($("tp-owner").value || "").trim() || null,
      priority: $("tp-prio").value, proposer: MYID || "hermes" });
    $("tp-title").value = ""; $("tp-owner").value = "";
    await tLoad();
  } catch (e) { tErrShow(e.message); }
  finally { $("tp-addbtn").disabled = false; }
}

function tOpen(on) {
  const p = $("taskpanel");
  const open = (on === undefined) ? !p.classList.contains("on") : !!on;
  p.classList.toggle("on", open);
  p.setAttribute("aria-hidden", open ? "false" : "true");
  if (open) {
    tLoad();
    if (TPOLL) clearInterval(TPOLL);
    TPOLL = setInterval(() => { tLoad().catch(() => {}); }, 10000);
  } else if (TPOLL) { clearInterval(TPOLL); TPOLL = null; }
}

$("taskbtn").onclick = () => tOpen();
$("tp-close").onclick = () => tOpen(false);
$("tp-refresh").onclick = () => tLoad();
$("tp-addbtn").onclick = tAdd;
$("tp-title").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); tAdd(); } });

// #347-0②：把任务清单抽屉的底边钉在输入区上沿 —— 输入区被拖高后抽屉不被压住。
// 默认（64px）时结果与改动前完全一致，不改变既有布局。
// 两条路径：① 同步钩子 —— 谁直接改 #text.style.height（含脚本/测试改高），
//   在同一个 tick 内就把抽屉底边钉好，不留一帧空档（旧实现只靠 ResizeObserver，
//   回调是异步的：改完 height 立刻读 panel.style.bottom 还是旧值，抽屉会短暂压住输入区）；
//   ② ResizeObserver —— 兜住原生拖拽手柄、字体加载、窗口缩放等不走 style.height 的路径。
(function pinTaskpanelBottom() {
  const c = $("composer"), p = $("taskpanel"), t = $("text");
  if (!c || !p) return;
  const apply = () => { p.style.bottom = c.offsetHeight + "px"; };
  apply();
  if (t && t.style) {
    try {
      const st = t.style, d = Object.getOwnPropertyDescriptor(st, "height");
      Object.defineProperty(st, "height", {
        configurable: true, enumerable: d ? !!d.enumerable : true,
        get() { return st.getPropertyValue("height"); },
        set(v) { st.setProperty("height", v == null ? "" : String(v)); apply(); }
      });
    } catch (e) {}
  }
  if (window.ResizeObserver) { try { new ResizeObserver(apply).observe(c); } catch (e) {} }
  window.addEventListener("resize", apply);
  // 原生拖拽手柄结束时的兜底（RO 未生效/不可用时）
  if (t) { t.addEventListener("mouseup", () => setTimeout(apply, 0)); t.addEventListener("input", apply); }
})();

// ================= #432-3 / #448 左栏 TAB：「我的群」/「任务队列」 =================
// #448：数据源从 task_svc :9981 的临时清单**换成 9980 自己的会话台账 todos**
// （GET /api/sessions/<本群 session_id>/todos）—— 同源、落库，刷新/换设备都还在。
// 入队不靠前端：人在群里 @agent 下发任务时后端自动建条目（待办），
// agent 开工/完成时把同一条目翻「进行中 / 已完成」，这里只如实呈现。
const ATABS = ["groups", "queue"];
// 状态口径（与后端 TODO_STATUS 一一对应）：open=待办 / doing=进行中 / done=已完成
const TQSTATUS = { open: "待办", doing: "进行中", done: "已完成" };
const TQCLS = { open: "pending", doing: "running", done: "done" };   // 沿用既有 .tqs 三档配色
const TQRANK = { doing: 0, open: 1, done: 2 };                       // 在办的在上、完成的在下

// ===== #534：列表只显示「抽象后的任务名」，鼠标悬停再看完整详细任务信息 =====
// #541：短名/详情改由**模型**给（入队后异步富化回写 task_name + task_summary）。
// 优先级：后端 todos.task_name（模型名 > 规则兜底名）> 前端兜底现抽。
// 富化是异步的：条目先带规则名 + enrich_state=pending 出现，模型回来后下一次轮询
// 就换成抽象名（复用下面 #448 已有的 5 秒对台账，不额外加轮询、不发重复请求）。
const TQNAME_MAX = 36;
const TQNAME_PREFIX_RE = /^(如下任务|以下任务|任务如下|任务|需求|要求|待办|你负责|负责如下|安排如下|分配如下)[:：,，、 ]*/;
const TQNAME_SERIAL_RE = /^[\(\[（【]?\d+[\.、\)）】]\s*/;

function tqName(t) {                       // 前端兜底：与后端 todo_task_name 同一套口径
  const back = String((t && t.task_name) || "").trim();
  if (back) return back;
  let b = String((t && t.text) || "").replace(/^#\d+\s*/, "").trim();
  b = b.replace(TQNAME_PREFIX_RE, "").replace(TQNAME_SERIAL_RE, "").trim();
  b = b.split(/[。！？；;!?\n\r]/)[0].trim().replace(/[，,、:：;；\s]+$/, "");
  if (!b) b = String((t && t.text) || "").trim();
  return b.length > TQNAME_MAX ? b.slice(0, TQNAME_MAX) + "…" : b;
}

function tqSummary(t) {                    // #541：模型给的详情（没回来就是空）
  return String((t && t.task_summary) || "").trim();
}

// #541-hover：富化状态的**展示映射**（只做人话标签 + 悬停解释，不改后端口径、不新增状态）：
//   enrich_state 原样回显（pending=富化中 / done=已富化 / fallback|skipped|空=未富化），
//   触发时间 = 本条入队时间（富化是在入队那一刻提交给模型的）。
function tqEnrich(t) {
  const st = String((t && t.enrich_state) || "");
  const label = st === "pending" ? "富化中" : (st === "done" ? "已富化" : "未富化");
  const at = String((t && t.created_at) || "").replace("T", " ").slice(0, 19);
  const why = st === "pending"
    ? "已交给模型重判、还没回来：当前显示的是规则兜底名"
    : (st === "done" ? "模型已回写任务名 / 详情"
       : (st === "fallback" ? "模型没回来（服务降级中）：仍显示规则兜底名"
          : (st === "skipped" ? "回填时模型判它不是任务：只标记、不删条目"
             : "老条目没有富化状态（#541 之前的存量）")));
  return {state: st, label: label, at: at, why: why,
          line: "富化：" + label + "（" + (st || "空") + "）· 触发 " + (at || "-") + " —— " + why};
}

function tqDetail(t) {                     // 悬停显示的完整信息（换行分段）
  const landing = (t.landing || [])[0] || "";
  const sum = tqSummary(t);
  const nm = String((t && t.task_name) || "").trim();
  const lines = [];
  if (nm) lines.push("任务名：" + nm);
  if (sum) lines.push("详情：" + sum.replace(/\n/g, " "));
  lines.push("原文：" + String(t.text || ""));
  lines.push("责任人：" + (mname(t.owner) || t.owner || "-"));
  lines.push("创建时间：" + String(t.created_at || "").replace("T", " ").slice(0, 19));
  lines.push("状态：" + (TQSTATUS[t.status] || t.status || "?"));
  lines.push(tqEnrich(t).line);              // #541-hover：富化状态 + 触发时间
  lines.push("落点：" + (landing || "（暂无）"));
  return lines.join("\n");
}
let ATAB = "groups";

function aTabSet(name) {
  if (ATABS.indexOf(name) < 0) name = "groups";
  ATAB = name;
  const on = (n) => name === n;
  [["tab-groups", "groups"], ["tab-queue", "queue"]].forEach(([id, n]) => {
    const b = $(id); if (!b) return;
    b.classList.toggle("on", on(n));
    b.setAttribute("aria-selected", on(n) ? "true" : "false");
  });
  $("groups").hidden = !on("groups");
  $("tqueue").hidden = !on("queue");
  const cb = $("tqclear");                      // #448-3：清空键只在队列 TAB 露头
  if (cb) cb.hidden = !on("queue");
  if (on("queue")) tqLoad();
}

async function tqLoad() {
  const box = $("tqueue"); if (!box) return;
  const g = tgid();
  const nEl = $("atq-n");
  try {
    // #448：同源读本群的会话台账（落库的 todos），不再是 9981 的临时清单
    const d = await api("GET", "/api/sessions/" + encodeURIComponent(g) + "/todos");
    const ts = (d && d.items) || [];
    const nOpen = ts.filter(t => t.status === "open").length;
    const nDoing = ts.filter(t => t.status === "doing").length;
    const nDone = ts.filter(t => t.status === "done").length;
    if (nEl) nEl.textContent = ts.length ? String(ts.length) : "";
    box.dataset.count = String(ts.length);
    box.dataset.group = g;
    box.dataset.open = String(nOpen);
    box.dataset.doing = String(nDoing);
    box.dataset.done = String(nDone);
    box.innerHTML = "";
    if (!ts.length) {
      box.innerHTML = '<div class="note">本群还没有任务记录。<br>' +
                      "人在群里 @agent 下发任务时会自动入队（待办）。</div>";
      return;
    }
    const sum = document.createElement("div");
    sum.className = "note"; sum.id = "tqsum";
    sum.textContent = "共 " + ts.length + " 条 · 待办 " + nOpen + " / 进行中 " +
                      nDoing + " / 已完成 " + nDone;
    box.appendChild(sum);
    ts.slice().sort((a, b) => ((TQRANK[a.status] ?? 9) - (TQRANK[b.status] ?? 9)) ||
                              String(b.created_at || "").localeCompare(String(a.created_at || "")))
      .forEach(t => {
        const el = document.createElement("div");
        el.className = "tqitem" + (t.status === "done" ? " done" : "");
        el.dataset.id = t.id; el.dataset.status = t.status || ""; el.dataset.owner = t.owner || "";
        const _nm = tqName(t);
        el.dataset.name = _nm;                       // #534 实测断言读这里
        el.dataset.hasDetail = tqDetail(t) ? "1" : "0";
        // #541：模型富化的实况（CDP 断言读这里：摘要/状态；pending=模型还没回来）
        const _sum = tqSummary(t);
        const _st = String((t && t.enrich_state) || "");
        el.dataset.summary = _sum;
        el.dataset.enrich = _st;
        const landing = (t.landing || [])[0] || "";
        const when = String(t.created_at || "").slice(5, 16).replace("T", " ");
        // #541-hover：悬停说明里带富化状态 + 触发时间（CDP 断言读 el.title / .tqd title / .tqe title）
        const _en = tqEnrich(t);
        el.dataset.enrichLabel = _en.label;
        el.dataset.enrichAt = _en.at;
        el.title = tqDetail(t);
        const badge = _st === "pending"
          ? '<span class="tqe" title="' + esc(_en.line) + '">富化中…</span>'
          : (_st === "fallback"
             ? '<span class="tqe" title="' + esc(_en.line) + '">规则名</span>'
             : (_st === "skipped"
                ? '<span class="tqe" title="' + esc(_en.line) + '">未富化</span>'
                : ""));
        el.innerHTML =
          '<div class="tqh"><span class="tqs ' + esc(TQCLS[t.status] || "") + '">' +
            esc(TQSTATUS[t.status] || t.status || "?") + "</span>" +
            '<span class="tqm">' + esc(mid(t.owner) || t.owner || "") + "</span></div>" +
          '<div class="tqd" title="' + esc(tqDetail(t)) + '">' +
            esc(tqName(t)) + badge + "</div>" +
          '<div class="tqm">' + esc(when) +
            (landing ? " · " + esc(String(landing).slice(0, 46)) : "") + "</div>";
        box.appendChild(el);
      });
  } catch (e) {
    if (nEl) nEl.textContent = "";
    box.dataset.count = "0";
    box.dataset.group = g;
    box.innerHTML = '<div class="note err">任务队列拉取失败：' + esc(e.message) +
                    "（服务连不上，不是没有任务）</div>";
  }
}

async function tqClear() {
  const g = tgid();
  if (!g) return;
  if (!window.confirm("清空本群「任务队列」？\n（服务端落库清空，刷新后仍为空；历史发言不受影响）")) return;
  const btn = $("tqclear");
  if (btn) { btn.disabled = true; btn.textContent = "清空中…"; }
  try {
    const d = await api("POST", "/api/sessions/" + encodeURIComponent(g) + "/todos/purge", {});
    if (btn) btn.textContent = "已清 " + ((d && d.changed) || 0) + " 条";
    await tqLoad();
  } catch (e) {
    if (btn) btn.textContent = "清空失败";
    window.alert("清空失败：" + e.message);
  }
  window.setTimeout(() => { if (btn) { btn.disabled = false; btn.textContent = "清空"; } }, 1600);
}

// ================= #452-1：全页可编辑元素一律关掉拼写检查 =================
// 静态属性写在 HTML 上（#text / #tp-title / #tp-owner / #gt）；
// 这里再扫一遍 DOM 兜住以后动态插入的 input/textarea，免得漏一个又画红线。
// 注：@ 联想浮层 #ac 不是可编辑元素（是 div 列表），输入 @ 仍发生在 #text 里，已被覆盖。
(function noSpellCheck(root) {
  const mark = (el) => {
    if (!el || (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA")) return;
    el.spellcheck = false;
    el.setAttribute("spellcheck", "false");
    el.setAttribute("autocorrect", "off");
    el.setAttribute("autocapitalize", "off");
    el.setAttribute("autocomplete", "off");
  };
  const sweep = (r) => {
    if (!r || !r.querySelectorAll) return;
    r.querySelectorAll("input,textarea").forEach(mark);
  };
  sweep(root || document);
  if (window.MutationObserver && document.body) {
    try {
      new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((nd) => {
        mark(nd); sweep(nd);
      }))).observe(document.body, { childList: true, subtree: true });
    } catch (e) {}
  }
})(document);


// ================= #476：#编号 引用标签 → 点击展开 / 收起的「引用浮窗」 =================
// 刚哥 #476 的需求：
//   ① 聊天记录里 #452 这类编号标识可点：点一次展开它代表的那条对话内容，再点一次关闭；
//   ② 弹出的内容允许拖动移动位置，也可以「固定」在所处位置；
//   ③ 可同时点开多个标签，多个浮窗并存。
// 数据来源：GET /api/sessions/<sid>/messages/<seq>（会话台账里单条取，就是那条消息的
//   发送方 / 时间 / 正文）；页面上已经渲染过的消息先吃本地缓存 MSGCACHE（pull 时顺手存），
//   命中就不打网络。浮窗层 #refpop 挂在 body 下 —— #log 每 3 秒轮询会 innerHTML=""，
//   挂在那儿才不会被轮询连带清掉。
const MSGCACHE = new Map();      // 键 = "<群 id>#<seq>" -> 消息对象（pull() 时顺手写）
// ⚠️ 必须带群 id：#NNN 只是**会话内**序号，跨群会撞号（真机实测踩到 —— 切到别的群再回来，
//    引用标签曾展开出另一个群同号的正文）。所以缓存键 = 群 id + seq，绝不裸用 seq。
function msgKey(sid, seq) { return String(sid || "") + "#" + String(seq); }
const REFPOP = new Map();        // seq -> {el, seq, sid, x, y, pinned}
const REFREST = new Set();       // 已还原过「固定浮窗」的群（轮询/重渲染不重复还原）
const LS_REFPINS = "group.refpins";
let REFSID = "";
let REFZ = 70;
let REFSRC = "";                     // 最近一次取正文实际走的来源（single / list），便于真机实测取证

// 把（已转义的）正文里的 #NNN 换成可点标签。前缀不吃 # / 词字符，避免 ##123、T-#123 这种误伤。
function linkRefs(html) {
  return String(html == null ? "" : html).replace(
    /(^|[^\w#])#(\d{1,7})(?!\d)/g,
    (all, pre, n) => pre + '<span class="mref" data-seq="' + n +
      '" title="点击展开 / 收起 #' + n + ' 这条消息">#' + n + "</span>");
}

// —— 固定记录（localStorage，按群分桶）：{sid: {"452": {x, y}}} ——
function refPinsAll() {
  try { return JSON.parse(localStorage.getItem(LS_REFPINS) || "{}") || {}; }
  catch (e) { return {}; }
}
function refPinsFor(sid) {
  const a = refPinsAll(), v = a[sid];
  return (v && typeof v === "object") ? v : {};
}
function refPinSet(sid, seq, rec) {
  if (!sid) return;
  const a = refPinsAll();
  const v = (a[sid] && typeof a[sid] === "object") ? a[sid] : {};
  if (rec) v[String(seq)] = { x: Math.round(rec.x), y: Math.round(rec.y) };
  else delete v[String(seq)];
  a[sid] = v;
  try { localStorage.setItem(LS_REFPINS, JSON.stringify(a)); } catch (e) { /* 无痕模式就算了 */ }
}

function refLayer() {
  let l = document.getElementById("refpop");
  if (!l) {
    l = document.createElement("div");
    l.id = "refpop";
    document.body.appendChild(l);
  }
  return l;
}

// 夹回视口内 → 落坐标。写回 rec.x/rec.y（取整），固定记录与还原走同一套算术，
// 所以「固定后刷新」拿到的坐标与固定那一刻逐像素一致。
function refPlace(rec) {
  const el = rec.el; if (!el) return;
  const w = el.offsetWidth || 360, h = el.offsetHeight || 180;
  const maxX = Math.max(6, (window.innerWidth || 1280) - w - 6);
  const maxY = Math.max(6, (window.innerHeight || 800) - h - 6);
  rec.x = Math.round(Math.min(Math.max(6, rec.x), maxX));
  rec.y = Math.round(Math.min(Math.max(6, rec.y), maxY));
  el.style.left = rec.x + "px";
  el.style.top = rec.y + "px";
}

function refFront(rec) {
  REFZ = Math.max(71, REFZ + 1);
  if (rec && rec.el) rec.el.style.zIndex = String(REFZ);
}

// 同一条引用的所有标签（正文里的 + 消息头部的 #seq）一起点亮 / 熄灭
function refMarkOn(seq) {
  document.querySelectorAll('.mref[data-seq="' + seq + '"]').forEach(x => x.classList.add("on"));
}
function refMarkOff(seq) {
  document.querySelectorAll('.mref[data-seq="' + seq + '"]').forEach(x => x.classList.remove("on"));
}

function refPinApply(seq, on) {                  // 置位（不翻转），还原时用
  const r = REFPOP.get(seq); if (!r) return;
  r.pinned = !!on;
  r.el.classList.toggle("pinned", r.pinned);
  const b = r.el.querySelector(".refpin");
  if (b) { b.classList.toggle("on", r.pinned); b.textContent = r.pinned ? "已固定" : "固定"; }
  refPinSet(r.sid, seq, r.pinned ? { x: r.x, y: r.y } : null);
}
function refPinToggle(seq) {
  const r = REFPOP.get(parseInt(seq, 10)); if (!r) return;
  refPinApply(r.seq, !r.pinned);
}

function refClose(seq, keepPin) {
  seq = parseInt(seq, 10);
  const r = REFPOP.get(seq); if (!r) return false;
  if (r.el && r.el.parentNode) r.el.parentNode.removeChild(r.el);
  REFPOP.delete(seq);
  refMarkOff(seq);
  // 收起 = 顺手取消固定：否则刷新后它又自己冒出来，像关不掉
  if (!keepPin && r.pinned) refPinSet(r.sid, seq, null);
  return true;
}

// forget=true：清掉「已还原」标记（换群回来/刷新后再还原一遍）；keepPin 保住固定记录
function refPopsReset(forget, sid) {
  Array.from(REFPOP.keys()).forEach(seq => refClose(seq, true));
  if (sid) { REFSID = sid; if (forget) REFREST.delete(sid); }
  else if (forget) REFREST.clear();
}

// 还原本群固定过的浮窗（刷新 / 切群回来都在原位）
function refPopsRestore(sid) {
  if (!sid) return 0;
  REFSID = sid;
  if (REFREST.has(sid)) return 0;
  REFREST.add(sid);
  const pins = refPinsFor(sid);
  const keys = Object.keys(pins);
  keys.forEach(k => {
    const seq = parseInt(k, 10); if (!seq) return;
    const p = pins[k] || {};
    refOpen(seq, { x: Number(p.x), y: Number(p.y), pinned: true });
  });
  return keys.length;
}

function refCloseAll() { refPopsReset(false); }

// 拖动：抓手是浮窗标题栏（.ph）；按钮上按下不算拖动
function refDrag(rec, ev) {
  if (ev.button !== undefined && ev.button !== 0) return;
  const sx = ev.clientX, sy = ev.clientY, ox = rec.x, oy = rec.y;
  rec.el.classList.add("dragging");
  const mv = (e) => { rec.x = ox + (e.clientX - sx); rec.y = oy + (e.clientY - sy); refPlace(rec); };
  const up = () => {
    window.removeEventListener("mousemove", mv);
    window.removeEventListener("mouseup", up);
    rec.el.classList.remove("dragging");
    refPlace(rec);
    rec.el.dataset.dragged = "1";
    if (rec.pinned) refPinSet(rec.sid, rec.seq, { x: rec.x, y: rec.y });   // 固定态拖完立刻落盘
  };
  window.addEventListener("mousemove", mv);
  window.addEventListener("mouseup", up);
  ev.preventDefault();
}

// 展开：元素同步建出来（点击立刻可见），正文再异步补 —— 不阻塞、也不闪一下空白
// #476：取某条消息的正文 —— 三级来源，前一档拿不到就退下一档：
//   ① 页面上已渲染过的消息（MSGCACHE，pull() 时顺手存）；
//   ② GET /api/sessions/<sid>/messages/<seq>（单条快路，服务端若提供则省一次流量）；
//   ③ GET /api/sessions/<sid>/messages?limit=1&before_seq=<seq+1>（**早就冻结的列表接口**），
//      从返回里挑 seq 相等那条 —— 线上当前实际走的就是这一条（9980 的 chat_svc 正由
//      别的活轮次在改，路由表里没有 ② 时引用标签照样能展开任意历史编号）。
//   前端因此不依赖任何新增服务端接口，function 只挂在「冻结契约」的端点上。
async function refFetchMsg(sid, seq) {
  const s = encodeURIComponent(sid);
  const tries = [
    "/api/sessions/" + s + "/messages/" + seq,
    "/api/sessions/" + s + "/messages?limit=1&before_seq=" + (seq + 1)
  ];
  let last = "";
  for (let i = 0; i < tries.length; i++) {
    try {
      const d = await api("GET", tries[i]);
      if (d && d.message && Number(d.message.seq) === Number(seq)) { REFSRC = (i === 0 ? "single:" : "list:") + seq; return d.message; }
      const arr = (d && d.messages) || [];
      const hit = arr.filter(x => Number(x.seq) === Number(seq))[0];
      if (hit) { REFSRC = (i === 0 ? "single:" : "list:") + seq; return hit; }
      last = "本群台账里没有 #" + seq + " 这条";
    } catch (e) { last = e.message; }
  }
  throw new Error(last || "取不到");
}

async function refOpen(seq, opt) {
  seq = parseInt(seq, 10);
  if (!seq) return null;
  const o = opt || {};
  if (REFPOP.has(seq)) {                       // 已开着：抬到最前，不重复建
    const r0 = REFPOP.get(seq);
    refFront(r0);
    if (o.pinned && !r0.pinned) refPinApply(seq, true);
    return r0;
  }
  const sid = o.sid || REFSID;
  if (!sid) return null;
  const el = document.createElement("div");
  el.className = "pop" + (o.pinned ? " pinned" : "");
  el.dataset.seq = String(seq);
  el.innerHTML =
    '<div class="ph"><span class="refseq">#' + esc(seq) + '</span>' +
      '<span class="refmeta">读取中…</span><span class="spacer"></span>' +
      '<button class="ghost refpin' + (o.pinned ? " on" : "") +
        '" title="固定在当前位置（刷新后仍在原位）">' + (o.pinned ? "已固定" : "固定") + '</button>' +
      '<button class="ghost refclose" title="收起这条引用">✕</button></div>' +
    '<div class="pb">读取中…</div>';
  const n = REFPOP.size;                        // 并存多个：每开一个错开一点，不叠成一摞
  const rec = {
    el, seq, sid, pinned: !!o.pinned,
    x: (typeof o.x === "number" && !isNaN(o.x)) ? o.x : 96 + (n % 6) * 30,
    y: (typeof o.y === "number" && !isNaN(o.y)) ? o.y : 110 + (n % 6) * 30,
  };
  REFPOP.set(seq, rec);
  refLayer().appendChild(el);
  refPlace(rec);
  refFront(rec);
  refMarkOn(seq);
  el.querySelector(".refclose").onclick = (e) => { e.stopPropagation(); refClose(seq); };
  el.querySelector(".refpin").onclick = (e) => { e.stopPropagation(); refPinToggle(seq); };
  el.querySelector(".ph").addEventListener("mousedown", (e) => {
    if (e.target && e.target.closest && e.target.closest("button")) return;
    refDrag(rec, e);
  });
  el.addEventListener("mousedown", () => refFront(rec));

  let m = MSGCACHE.get(msgKey(sid, seq)), err = "";
  if (!m) {                                     // 没在页面上 → 打服务端取真实正文
    try { m = await refFetchMsg(sid, seq); }
    catch (e) { err = e.message; }
  }
  if (!document.body.contains(el)) return null; // 等待期间用户已经收起
  const rm = el.querySelector(".refmeta"), pb = el.querySelector(".pb");
  if (!m) {
    rm.textContent = "取不到";
    pb.className = "pb err";
    pb.textContent = "拉不到 #" + seq + " 的正文" + (err ? "（" + err + "）" : "") + "。";
    refPlace(rec);
    return rec;
  }
  rm.textContent = mname(m.author) +
    (m.author && m.author.type === "agent" ? "（Agent）" : "（人）") +
    (m.created_at ? " · " + m.created_at : "");
  pb.innerHTML = linkRefs(esc(m.text || ""));
  refPlace(rec);                                // 正文进来后高度变了，重新夹一次
  return rec;
}

function refToggle(seq) {
  seq = parseInt(seq, 10);
  if (!seq) return null;
  return REFPOP.has(seq) ? (refClose(seq), null) : refOpen(seq);
}

// 点击委托：全文档任何 .mref（正文里的引用标签 / 每条消息头部的 #seq）都走这里。
// 委托而不是逐个绑 onclick —— #log 每次轮询重渲染，绑在元素上的监听会一起没。
document.addEventListener("click", (e) => {
  const t = (e.target && e.target.closest) ? e.target.closest(".mref") : null;
  if (!t) return;
  const seq = parseInt(t.dataset.seq, 10);
  if (!seq) return;
  e.preventDefault();
  refToggle(seq);
});

// 自测句柄（真机实测读内部状态用；不改变任何行为）
window.__h476 = { MSGCACHE, REFPOP, linkRefs, refOpen, refClose, refToggle,
                  refPinToggle, refPinApply, refPinsFor, refPopsRestore, refPopsReset,
                  src: () => REFSRC, fetchMsg: refFetchMsg };
</script>
</body>
</html>
